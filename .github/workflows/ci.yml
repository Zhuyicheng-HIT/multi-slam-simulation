name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Static and protocol smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install smoke-test dependencies
        run: python -m pip install --upgrade pip pytest PyYAML

      - name: Run smoke tests
        run: python tools/ci_smoke_test.py
