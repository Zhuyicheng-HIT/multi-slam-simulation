/**:
  ros__parameters:
    # Validation needs flight control, estimator sensor inputs, and the
    # ExternalNav ODOMETRY bridge. Loading every MAVROS plugin adds substantial
    # callback and discovery load without contributing to these contracts.
    plugin_allowlist:
      - command
      - global_position
      - gps_status
      - imu
      - local_position
      - odometry
      # Do not load the MAVROS parameter plugin for validation. Its initial
      # full parameter pull competes with FCU telemetry on the SITL TCP link.
      - setpoint_position
      - sys_status
      - sys_time
