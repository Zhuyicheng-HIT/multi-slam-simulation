# Project-owned RTAB-Map RGB-D baseline. The launch adapter converts these
# values to the upstream rtabmap_launch arguments; edit this file instead of
# growing one-off command lines.
d435i_rtabmap:
  topics:
    rgb: /front/d435i/color/image_raw
    depth: /front/d435i/aligned_depth_to_color/image_raw
    camera_info: /front/d435i/color/camera_info
    odom: /rtabmap/odom

  launch:
    frame_id: base_link
    vo_frame_id: odom
    use_sim_time: true
    approx_sync: false
    qos: 2
    visual_odometry: true
    rtabmap_viz: false
    rviz: false
    delete_db_on_start: true
    database_path: ~/.ros/d435i_rtabmap_baseline.db

  odometry_parameters:
    # Feature budget and detector are explicit so F2M/F2F comparisons do not
    # silently inherit machine-specific RTAB-Map defaults.
    Vis/MaxFeatures: 1000
    Kp/MaxFeatures: 1000
    Kp/DetectorStrategy: 6
    Odom/MinDepth: 0.105
    Odom/MaxDepth: 10.0
    Vis/MinInliers: 10
    Odom/ResetCountdown: 3
    # 0=frame-to-map, 1=frame-to-frame.
    Odom/Strategy: 0
    OdomF2M/MaxSize: 2000
    OdomF2F/MaxSize: 1000

  rtabmap_parameters:
    Kp/MaxFeatures: 1000
    Kp/DetectorStrategy: 6
    Mem/UseOdomFeatures: true
    # Keep the historical mismatch explicit. The feature_aligned profile
    # changes only this value from 8 to 6.
    Vis/FeatureType: 8
    RGBD/OptimizeMaxError: 3.0
    RGBD/ProximityBySpace: true
    RGBD/ProximityPathMaxNeighbors: 1
    RGBD/LoopClosureReextractFeatures: true
    Rtabmap/LoopThr: 0.11
    Mem/IncrementalMemory: true
