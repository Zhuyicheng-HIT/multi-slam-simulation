fastlio_cloud_mapper:
  ros__parameters:
    input_topic: /cloud_registered
    odom_topic: /Odometry
    scan_topic: /cloud_registered_filtered
    reliable_scan_topic: /cloud_registered_reliable
    map_topic: /fastlio_denoised_map
    output_frame: camera_init
    scan_voxel: 0.05
    map_voxel: 0.10
    radius_filter: 0.22
    radius_min_neighbors: 1
    min_map_hits: 1
    max_scan_points: 65000
    max_map_voxels: 220000
    map_window_frames: 300
    map_publish_every: 1
    enable_quality_gate: true
    require_odom_for_map: true
    max_odom_speed_mps: 3.0
    max_odom_jump_m: 0.80
    max_z_jump_m: 0.55
    min_scan_map_overlap: 0.025
    min_overlap_map_voxels: 500
    overlap_warmup_frames: 10
    overlap_neighbor_voxels: 2
    overlap_sample_stride: 4
    min_range: 0.10
    max_range: 40.0
    z_min: -20.0
    z_max: 10.0
    restamp: true

fastlio_occupancy_grid:
  ros__parameters:
    input_topic: /cloud_registered_reliable
    odom_topic: /Odometry
    grid_topic: /fastlio_occupancy_grid
    marker_topic: /fastlio_occupancy_cells
    free_marker_topic: /fastlio_occupancy_free_cells
    occupied_marker_topic: /fastlio_occupancy_occupied_cells
    output_frame: camera_init
    resolution: 0.10
    width_m: 34.0
    height_m: 26.0
    origin_x: -17.0
    origin_y: -13.0
    min_range: 0.10
    max_range: 30.0
    z_min: -0.50
    z_max: 3.50
    point_stride: 1
    publish_every_n_clouds: 1
    use_odometry: true
    raycast_free_space: true
    occupied_increment: 12
    free_decrement: 4
    occupied_threshold: 45
    free_threshold: -12
    log_odds_decay_per_cloud: 1
    stale_after_clouds: 90
    occupied_cell_inflation: 1
