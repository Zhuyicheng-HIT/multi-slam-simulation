/**:
  ros__parameters:
    plugin_allowlist:
      - command
      - distance_sensor
      - global_position
      - gps_status
      - imu
      - local_position
      - odometry
      - optical_flow
      # Do not load the MAVROS parameter plugin for validation. Its initial
      # full parameter pull competes with FCU telemetry on the SITL TCP link.
      - rangefinder
      - setpoint_position
      - sys_status
      - sys_time
