schema: uf_dynamic_scenarios_v2
detector_truth_access: forbidden
truth_usage: evaluator_only
baseline: uf_lio_adapter.TemporalVoxelFilter
metrics:
  - dynamic_precision
  - dynamic_recall
  - dynamic_f1
  - static_preservation_rate
  - false_dynamic_ratio
  - static_map_contamination
  - map_completeness
  - ate
  - rpe
  - native_lidar_factor_residual
  - cpu_percent
  - memory_mib
  - latency_p50_ms
  - latency_p95_ms
  - latency_p99_ms
  - unknown_ratio
  - failure_mode
reproducibility:
  seeds: [101, 202, 303]
  repeats_per_seed: 2
  frames_per_run: 40
  low_altitude_near_constant_height: true
  detector_missing_ray_implies_free: false
scenarios:
  - id: static_fast_turn
    dynamic_entities: []
    protects: [static_structure, pose_change]
  - id: new_area_in_fov
    dynamic_entities: []
    protects: [unknown_space, new_static_structure]
  - id: person_crossing
    dynamic_entities: [pedestrian]
  - id: stationary_then_moving
    dynamic_entities: [pedestrian]
    protects: [motion_onset]
  - id: multiple_people_crossing
    dynamic_entities: [pedestrian, pedestrian]
  - id: small_fast_target
    dynamic_entities: [small_fast_object]
  - id: slow_target
    dynamic_entities: [slow_object]
  - id: moving_box_or_vehicle
    dynamic_entities: [box_or_vehicle]
  - id: opening_closing_door
    dynamic_entities: [door]
    protects: [articulated_static_structure]
  - id: large_dynamic_occlusion
    dynamic_entities: [large_occluder]
    protects: [background_reappearance]
  - id: radial_approach_departure
    dynamic_entities: [radial_target]
    protects: [low_transverse_parallax]
  - id: moving_then_stops
    dynamic_entities: [stopped_recent_dynamic]
    protects: [temporal_dynamic_hold]
  - id: co_moving_target
    dynamic_entities: [co_moving_target]
    protects: [near_zero_relative_velocity]
  - id: occlusion_appear_disappear
    dynamic_entities: [intermittently_visible_target]
    protects: [occlusion, reappearance]
  - id: near_wall_motion
    dynamic_entities: [wall_adjacent_target]
    protects: [static_wall]
  - id: vertical_target_motion
    dynamic_entities: [vertical_target]
    protects: [near_constant_uav_altitude]
  - id: nonrigid_motion
    dynamic_entities: [articulated_nonrigid_target]
  - id: far_sparse_target
    dynamic_entities: [far_sparse_target]
    protects: [unknown_space, conservative_observability]
