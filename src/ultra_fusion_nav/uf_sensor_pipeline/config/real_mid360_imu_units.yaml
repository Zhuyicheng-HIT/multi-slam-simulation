# Real MID360S installation profile. The canonical transform, frame and topic
# contract lives in real_mid360s_d435i_geometry.yaml. Do not duplicate its
# numeric rotation here and do not infer the unmeasured body translation.
fcu_observation_bridge:
  ros__parameters:
    # This remains the MID360S internal IMU, normalized to SI/body-FLU by the
    # relay. The separate MAVROS/ArduPilot IMU is not a backend substitute.
    imu_input_topic: /sensors/imu

sensor_relay_manager:
  ros__parameters:
    geometry_contract_file: package://uf_sensor_pipeline/config/real_mid360s_d435i_geometry.yaml

fault_injector_imu:
  ros__parameters:
    geometry_contract_file: package://uf_sensor_pipeline/config/real_mid360s_d435i_geometry.yaml

pointcloud_body_filter:
  ros__parameters:
    # Real self-body removal is fail-open until the body origin translation
    # and CAD component geometry are measured. Raw /livox/lidar is never
    # modified; this separate output currently preserves every CustomPoint.
    geometry_contract_file: package://uf_sensor_pipeline/config/real_mid360s_d435i_geometry.yaml
    filter_enabled: false
    geometry_complete: false
    input_message_type: livox_custom
    input_topic: /livox/lidar
    output_topic: /sensors/lidar/livox_body_filtered
