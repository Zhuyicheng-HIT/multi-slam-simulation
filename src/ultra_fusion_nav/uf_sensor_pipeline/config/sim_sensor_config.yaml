pointcloud_body_filter:
  ros__parameters:
    input_topic: /sim/mid360/points_raw
    output_topic: /sensors/lidar/points_body_filtered
    body_min_x_m: -0.45
    body_max_x_m: 0.45
    body_min_y_m: -0.45
    body_max_y_m: 0.45
    body_min_z_m: -0.35
    body_max_z_m: 0.15
    min_range_m: 0.10
    max_range_m: 40.0

fault_injector_lidar:
  ros__parameters:
    modality: lidar
    input_topic: /sensors/lidar/points_body_filtered
    output_topic: /sensors/lidar/points
    fault_type: none
    fault_start_s: 0.0
    fault_duration_s: 0.0
    magnitude: 0.0
    seed: 7

