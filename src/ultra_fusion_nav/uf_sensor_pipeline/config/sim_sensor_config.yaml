fcu_observation_bridge:
  ros__parameters:
    flow_input_topic: /mavros/optical_flow/raw/optical_flow
    flow_output_topic: /fcu/optical_flow/rad
    imu_input_topic: /mavros/imu/data_raw
    range_input_topic: /mavros/rangefinder/rangefinder
    gnss_fix_input_topic: /mavros/global_position/raw/fix
    gnss_fix_output_topic: /fcu/gnss/fix
    gnss_raw_input_topic: /mavros/gpsstatus/gps1/raw
    gnss_raw_output_topic: /fcu/gnss/raw
    minimum_flow_interval_s: 0.005
    maximum_flow_interval_s: 0.5
    maximum_imu_gap_s: 0.12
    maximum_flow_wait_s: 0.3
    range_timeout_s: 0.5
    stale_after_s: 1.0

nmea_gnss:
  ros__parameters:
    # C2 TESTRN output: RS232, 115200 baud, 8 data bits, no parity, 1 stop bit.
    port: /dev/ttyUSB0
    baudrate: 115200
    frame_id: gnss_antenna_link
    fix_topic: /gnss/direct/fix
    raw_topic: /sensors/gnss/raw
    time_reference_topic: /gnss/direct/time_reference
    diagnostics_topic: /gnss/direct/diagnostics
    strict_checksum: true
    serial_timeout_s: 0.02
    maximum_pair_age_s: 1.5
    horizontal_uere_m: 3.0
    vertical_uere_m: 5.0
    stale_after_s: 2.0

gnss_metadata_relay:
  ros__parameters:
    input_topic: /mavros/gpsstatus/gps1/raw
    output_topic: /sensors/gnss/raw
    fix_input_topic: /sensors/gnss/fix_unthrottled
    fix_output_topic: /sensors/gnss/fix
    # Companion-estimator rate only. MAVROS and ArduPilot retain their native
    # GPS stream rates for FCU navigation, arming and flight control.
    # ATGM336H-class companion GNSS is measured at 5 Hz on the target link.
    output_rate_hz: 5.0
    # Existing simulation bags show P99=26 ms and max=51 ms nearest fix/raw
    # stamp separation. Raw metadata outside this window is omitted; the fix
    # itself is never blocked.
    association_tolerance_s: 0.06

pointcloud_body_filter:
  ros__parameters:
    input_topic: /sim/mid360/points_raw
    output_topic: /sensors/lidar/points_body_filtered
    # Vehicle self-return envelope: 0.50 m x 0.50 m x 0.10 m centered at body.
    body_min_x_m: -0.25
    body_max_x_m: 0.25
    body_min_y_m: -0.25
    body_max_y_m: 0.25
    body_min_z_m: -0.05
    body_max_z_m: 0.05
    # R_body_lidar: MID360 optical axis pitches 15 deg nose-down.
    lidar_to_body_rotation: [0.9659258263, 0.0, 0.2588190451, 0.0, 1.0, 0.0, -0.2588190451, 0.0, 0.9659258263]
    # Measured simulation mount: 5 cm forward and 10 cm above body origin.
    lidar_to_body_translation: [0.05, 0.0, 0.10]
    min_range_m: 0.10
    max_range_m: 40.0

fault_injector_lidar:
  ros__parameters:
    modality: lidar
    input_topic: /sensors/lidar/points_body_filtered
    output_topic: /sensors/lidar/points
    fault_type: none
    fault_start_s: 0.0
    fault_duration_s: 0.0
    magnitude: 0.0
    seed: 7

fault_injector_imu:
  ros__parameters:
    modality: imu
    input_topic: /mavros/imu/data_raw
    output_topic: /sensors/imu
    # SITL's FCU telemetry clock can jump backwards under low RTF. Align the
    # simulation output to ROS time while keeping the real-hardware default
    # (source timestamps) unchanged in the generic injector.
    restamp_output: true
    fault_type: none
    fault_start_s: 0.0
    fault_duration_s: 0.0
    magnitude: 0.0
    secondary_magnitude: 0.0
    seed: 11

fault_injector_gnss:
  ros__parameters:
    modality: gnss
    # SITL exposes the simulated receiver observation through MAVROS raw/fix.
    # No FCU local-position or fused-global-position topic is used here.
    input_topic: /mavros/global_position/raw/fix
    output_topic: /sensors/gnss/fix
    # MAVROS' FCU timesync can reset when Gazebo runs below real time, while
    # every estimator in this simulation uses /clock. Normalize only this
    # simulation-facing stream; real NMEA and rosbag paths keep source time.
    restamp_output: true
    fault_type: none
    fault_start_s: 0.0
    fault_duration_s: 0.0
    magnitude: 0.0
    secondary_magnitude: 0.0
    seed: 13

fault_injector_optical_flow:
  ros__parameters:
    modality: optical_flow
    input_topic: /sim/optical_flow/rad
    output_topic: /sensors/optical_flow/rad
    fault_type: none
    fault_start_s: 0.0
    fault_duration_s: 0.0
    magnitude: 0.0
    seed: 17

fault_injector_depth:
  ros__parameters:
    modality: depth
    input_topic: /front/d435i/aligned_depth_to_color/image_raw
    output_topic: /sensors/rgbd/depth
    fault_type: none
    fault_start_s: 0.0
    fault_duration_s: 0.0
    magnitude: 0.0
    seed: 19

fault_injector_color:
  ros__parameters:
    modality: color
    input_topic: /front/d435i/color/image_raw
    output_topic: /sensors/rgbd/color
    fault_type: none
    fault_start_s: 0.0
    fault_duration_s: 0.0
    magnitude: 127.0
    seed: 23

sensor_contract_monitor:
  ros__parameters:
    lidar_topic: /sensors/lidar/points
    imu_topic: /sensors/imu
    gnss_topic: /sensors/gnss/fix
    optical_flow_topic: /sensors/optical_flow/rad
    depth_topic: /sensors/rgbd/depth
    color_topic: /sensors/rgbd/color
    startup_grace_s: 12.0
    stale_after_s: 3.0
