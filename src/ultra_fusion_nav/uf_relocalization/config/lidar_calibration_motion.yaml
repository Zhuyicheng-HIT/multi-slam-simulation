lidar_calibration_motion_node:
  ros__parameters:
    # Direct Livox CustomMsg: this branch intentionally does not consume IMU,
    # odometry, native factors, or backend-deskewed point clouds.
    input_topic: /livox/lidar
    output_topic: /calibration/lidar_relative_motion
    # The backend hand-eye/time solver accepts intervals up to 0.50 s and
    # needs at least eight pairs in its five-second observability window.
    minimum_interval_s: 0.42
    maximum_interval_s: 0.50
    minimum_range_m: 0.50
    maximum_range_m: 30.0
    voxel_size_m: 0.40
    minimum_points: 150
    maximum_points: 900
    maximum_correspondence_distance_m: 1.00
    maximum_iterations: 12
    maximum_fitness_score: 0.12
    minimum_inlier_ratio: 0.35
    maximum_translation_m: 1.5
    maximum_rotation_rad: 0.50
    maximum_rotation_information_condition: 200.0
