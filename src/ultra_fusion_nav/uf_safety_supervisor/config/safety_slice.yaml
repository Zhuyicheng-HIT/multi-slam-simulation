raw_obstacle_safety_monitor:
  ros__parameters:
    raw_lidar_topic: /livox/lidar
    odometry_topic: /fusion/unified/odom
    body_motion_topic: /mavros/local_position/odom
    candidate_setpoint_topic: /autonomy/intent/mission/pose
    candidate_path_topic: /autonomy/candidate_path
    raw.timeout_s: 0.20
    raw.future_tolerance_s: 0.02
    raw.minimum_points: 20
    raw.minimum_range_m: 0.12
    raw.maximum_range_m: 40.0
    motion.timeout_s: 0.25
    body.front_m: 0.32
    body.half_width_m: 0.32
    body.half_height_m: 0.18
    safety.lateral_margin_m: 0.28
    safety.vertical_margin_m: 0.22
    safety.margin_m: 0.35
    safety.caution_margin_m: 0.75
    braking.reaction_time_s: 0.25
    braking.maximum_deceleration_mps2: 2.0
    braking.brake_ttc_s: 1.25
    braking.caution_ttc_s: 2.50
    extrinsic.body_from_lidar_xyz: [0.0, 0.0, 0.0]
    extrinsic.body_from_lidar_rpy: [0.0, 0.0, 0.0]

flight_command_arbiter:
  ros__parameters:
    automatic_mode_name: GUIDED
    intent_timeout_s: 0.50
    current_pose_timeout_s: 0.25
    obstacle_timeout_s: 0.25
    maximum_setpoint_jump_m: 2.50
    caution_step_m: 0.30
