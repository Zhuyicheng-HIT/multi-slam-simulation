reliability_scheduler:
  ros__parameters:
    # RGB-D is disabled in the current four-source milestone. Add vision here
    # only when its frontend and score publisher are launched.
    active_modalities: [lidar, gnss, imu, optical_flow]
    # IMU propagation is mandatory. The remaining active modalities are
    # alternative pose/position constraints, so one bad optional factor cannot
    # by itself declare the complete estimator unavailable.
    required_modalities: [imu]
    # Keep the output stream alive while any one fresh, usable source remains.
    # Missing IMU propagation raises RISK and lets the safety state machine
    # hold, but is not by itself an ExternalNav kill switch.
    minimum_usable_modalities: 1
    score_timeout_s: 1.0
    # Native point-to-plane diagnostics are intentionally throttled to 1 Hz.
    # Allow bounded processing jitter without extending IMU/flow freshness.
    lidar_score_timeout_s: 1.6
    # Trigger recovery from persistent LiDAR loss, not from a single bad frame
    # or an optional GNSS/flow degradation.
    automatic_relocalization_enabled: true
    automatic_relocalization_degradation_threshold: 0.85
    automatic_relocalization_hold_s: 1.0
    automatic_relocalization_cooldown_s: 15.0
    automatic_relocalization_startup_grace_s: 10.0
    # LiDAR degradation alone only down-weights that factor. Relocalize when
    # several fresh LiDAR scores agree and no independent horizontal-position
    # source remains observable.
    automatic_relocalization_minimum_lidar_observations: 3
    automatic_relocalization_position_support_threshold: 0.15
    relocalization_commit_timeout_s: 2.0
    relocalization_ready_topic: /relocalization/ready
    degraded_threshold: 0.35
    risk_threshold: 0.60
    failsafe_threshold: 0.85
    factor_disable_threshold: 0.80
    factor_enable_threshold: 0.55
    minimum_weight: 0.05
    maximum_covariance_inflation: 20.0
    # paper_eq15 is an opt-in A/B: Eq. (19) is compared with one LiDAR
    # threshold and the factor is either full weight or zero weight.
    lidar_admission_mode: adaptive
    lidar_paper_activation_threshold: 0.25
    # Valid high-dynamic IMU remains a propagation factor with at least 0.20
    # reliability weight. Stale, invalid, or saturated IMU is still disabled.
    imu_soft_max_degradation: 0.80
    transition_dwell_s: 0.5
    recovery_dwell_s: 1.5
    recovered_hold_s: 1.0
    # A capability is observable when at least one enabled factor can support
    # it. This is deliberately independent from the global health state.
    capability_observable_threshold: 0.15
    publish_rate_hz: 10.0
